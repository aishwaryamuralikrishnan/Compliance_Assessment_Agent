# Retrieval corpus sources (EUR-Lex, EU open reuse policy).
#
# Consolidated texts carry the corrigenda / amendments but EUR-Lex omits the preamble
# from them, so articles + annexes are taken from the consolidated version and the
# recitals from the original Official Journal text.
#
# Bump `chunk_version` whenever chunker.py changes how units are cut; `seed reindex`
# re-chunks and re-embeds everything.

chunk_version: 2

regulations:
  GDPR:
    title: "Regulation (EU) 2016/679 (General Data Protection Regulation)"
    short: GDPR
    articles_source:
      celex: 02016R0679-20160504
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504"
    recitals_source:
      celex: 32016R0679
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679"
    expected:
      articles: 99
      recitals: 173
      annexes: 0

  AI_ACT:
    title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    short: "AI Act"
    articles_source:
      celex: 02024R1689-20260727        # consolidated as of 27 Jul 2026
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R1689-20260727"
    recitals_source:
      celex: 32024R1689
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689"
    expected:
      articles: 113          # numbered articles; the 2026 amendment also inserted 4a, 60a, 75a-75d
      recitals: 180
      annexes: 14            # Annex XIV added by the 2026 amendment

# Articles longer than this many words AND with 2+ numbered paragraphs are split
# into one chunk per numbered paragraph (Art. 6, Art. 13, ...). Shorter articles are
# one chunk.
split_article_over_words: 350
