<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#374151;stroke-width:1.4}
    .t{fill:#1f2937;font-weight:700;text-anchor:middle}
    .s{fill:#6b7280;font-size:10.5px;text-anchor:middle}
    .e{fill:none;stroke:#374151;stroke-width:1.5}
    .loop{fill:none;stroke:#b45309;stroke-width:1.8;stroke-dasharray:6 4}
    .lbl{fill:#6b7280;font-size:10.5px}
  </style>
  <rect x="0" y="0" width="700" height="270" fill="#f4f5f8"/>

  <!-- entry -->
  <text x="60" y="78" class="lbl" text-anchor="middle">query from</text>
  <text x="60" y="92" class="lbl" text-anchor="middle">the worker</text>
  <line x1="100" y1="100" x2="118" y2="100" class="e" marker-end="url(#a)"/>

  <!-- retrieve -->
  <rect x="118" y="70" width="170" height="60" rx="6" class="box"/>
  <text x="203" y="94" class="t">retrieve</text>
  <text x="203" y="110" class="s">three lookups → fused top-20</text>
  <text x="203" y="123" class="s">→ reranked top-5</text>
  <line x1="288" y1="100" x2="330" y2="100" class="e" marker-end="url(#a)"/>

  <!-- grade (diamond) -->
  <polygon points="400,60 470,100 400,140 330,100" class="box"/>
  <text x="400" y="97" class="t">grade</text>
  <text x="400" y="112" class="s">sufficient?</text>

  <!-- yes -> return -->
  <line x1="470" y1="100" x2="540" y2="100" class="e" marker-end="url(#a)"/>
  <text x="498" y="92" class="lbl">yes</text>
  <rect x="540" y="70" width="130" height="60" rx="6" class="box"/>
  <text x="605" y="94" class="t">return passages</text>
  <text x="605" y="110" class="s">relevant ones first;</text>
  <text x="605" y="123" class="s">the worker drafts</text>

  <!-- no -> rewrite -> back to retrieve -->
  <polyline points="400,140 400,200 345,200" class="loop" marker-end="url(#b)"/>
  <text x="408" y="172" class="lbl">no, and attempt &lt; 3</text>
  <rect x="215" y="172" width="130" height="58" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
  <text x="280" y="193" class="t" fill="#b45309">rewrite query</text>
  <text x="280" y="209" class="s">cheap model, guided by</text>
  <text x="280" y="222" class="s">the grader's "missing" note</text>
  <polyline points="215,200 170,200 170,130" class="loop" marker-end="url(#b)"/>
  <text x="120" y="170" class="lbl" text-anchor="end">attempt + 1</text>

  <!-- stop conditions -->
  <text x="40" y="258" class="lbl" fill="#1f2937" font-weight="700">stops when</text>
  <text x="120" y="258" class="lbl">the grader says sufficient · 3 attempts used · after a rewrite most passages are already relevant (diminishing returns)</text>
</svg>
