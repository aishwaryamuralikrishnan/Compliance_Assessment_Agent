<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .card{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .lbl{fill:#6b7280;font-size:10px;letter-spacing:.06em}
    .t{fill:#1f2937}
    .b{font-weight:700}
    .pill{font-size:10px;font-weight:700}
  </style>
  <rect x="0" y="0" width="640" height="400" fill="#f4f5f8"/>
  <rect x="20" y="16" width="600" height="368" rx="8" class="card"/>

  <!-- header -->
  <text x="36" y="42" class="t b" font-size="14">Assessment A-0012 · Automated credit scoring (BNPL)</text>
  <rect x="408" y="30" width="60" height="18" rx="9" fill="#fee2e2"/><text x="438" y="43" text-anchor="middle" fill="#b91c1c" class="pill">High risk</text>
  <rect x="474" y="30" width="72" height="18" rx="9" fill="#ede9fe"/><text x="510" y="43" text-anchor="middle" fill="#7c3aed" class="pill">High-risk AI</text>
  <rect x="552" y="30" width="56" height="18" rx="9" fill="#e0f2fe"/><text x="580" y="43" text-anchor="middle" fill="#0369a1" class="pill">DPIA</text>
  <text x="36" y="58" class="lbl">ID · TITLE</text>
  <text x="604" y="58" class="lbl" text-anchor="end">FLAGS</text>

  <!-- verdict banner -->
  <rect x="36" y="68" width="568" height="40" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="36" y="68" width="4" height="40" fill="#b91c1c"/>
  <text x="48" y="85" class="b" fill="#b91c1c">Do not build as described.</text>
  <text x="48" y="101" class="t" font-size="11">Two-sentence summary citing the decisive provisions.</text>
  <text x="604" y="85" class="lbl" text-anchor="end">VERDICT</text>

  <!-- findings -->
  <text x="36" y="130" class="lbl">FINDINGS · severity-tagged, blockers first, each with citations</text>
  <rect x="36" y="140" width="64" height="18" rx="9" fill="#fee2e2"/><text x="68" y="153" text-anchor="middle" fill="#b91c1c" class="pill">Blocker</text>
  <text x="112" y="153" class="t">Must change before build.</text>
  <text x="604" y="153" text-anchor="end" fill="#1d4ed8" font-family="Menlo, monospace" font-size="11">GDPR Art. 22(1) · 22(3)</text>

  <rect x="36" y="168" width="64" height="18" rx="9" fill="#fef3c7"/><text x="68" y="181" text-anchor="middle" fill="#b45309" class="pill">Required</text>
  <text x="112" y="181" class="t">An obligation to fulfil.</text>
  <text x="604" y="181" text-anchor="end" fill="#1d4ed8" font-family="Menlo, monospace" font-size="11">GDPR Art. 35(3)(a)</text>

  <rect x="36" y="196" width="64" height="18" rx="9" fill="#dcfce7"/><text x="68" y="209" text-anchor="middle" fill="#15803d" class="pill">Covered</text>
  <text x="112" y="209" class="t">Already handled (often by an organisation fact in memory).</text>
  <text x="604" y="209" text-anchor="end" fill="#1d4ed8" font-family="Menlo, monospace" font-size="11">GDPR Art. 45</text>

  <!-- next steps -->
  <text x="36" y="240" class="lbl">NEXT STEPS</text>
  <text x="36" y="257" class="t">1. Add a human-review queue.   2. Start the DPIA.   3. Register the system as high-risk AI.</text>

  <!-- sources + disclaimer -->
  <text x="36" y="286" class="lbl">SOURCES RETRIEVED · VERIFIED CITATIONS</text>
  <text x="36" y="302" class="t" font-size="11">GDPR Art. 22, GDPR Rec. 71, GDPR Art. 35, AI Act Annex III point 5, GDPR Art. 45 …</text>
  <text x="36" y="326" fill="#6b7280" font-size="10" font-style="italic">Automated first assessment, not legal advice; becomes a record only after the DPO approves.</text>

  <!-- action bar: download + review status (the review request is automatic) -->
  <rect x="36" y="342" width="140" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><text x="106" y="359" text-anchor="middle" class="t" font-size="11">Download (Markdown)</text>
  <text x="188" y="359" fill="#6b7280" font-size="10">Sent to the DPO automatically; waiting for the decision. Only the DPO's approval writes the register.</text>
</svg>
