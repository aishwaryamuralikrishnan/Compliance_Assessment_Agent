<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#ffffff;stroke:#374151;stroke-width:1.2}
    .pm{fill:#e8f0f7}
    .dpo{fill:#f3ecdf}
    .store{fill:#eaf2e9}
    .t{fill:#1f2937}
    .b{font-weight:700}
    .s{fill:#6b7280;font-size:10.5px}
    .lane{fill:#6b7280;font-size:10px;letter-spacing:.06em}
    .edge{fill:none;stroke:#374151;stroke-width:1.4}
    .edge.blue{stroke:#1f5f8b;stroke-width:2}
    .edge.dash{stroke-dasharray:5 4}
    .el{fill:#1f5f8b;font-size:10.5px}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f5f8b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#f4f5f8"/>

  <!-- lanes -->
  <rect x="14" y="14" width="872" height="92" rx="8" class="pm" stroke="#d1d5db"/>
  <text x="26" y="30" class="lane">PRODUCT MANAGER · Assistant page</text>
  <rect x="14" y="114" width="872" height="80" rx="8" class="dpo" stroke="#d1d5db"/>
  <text x="26" y="130" class="lane">DATA PROTECTION OFFICER · Review queue</text>
  <rect x="14" y="202" width="872" height="84" rx="8" class="store" stroke="#d1d5db"/>
  <text x="26" y="218" class="lane">RECORDS · processing register and long-term memory</text>

  <!-- PM lane -->
  <rect x="30" y="44" width="150" height="50" rx="6" class="box"/>
  <text x="105" y="64" text-anchor="middle" class="t b">1 · Describe the feature</text>
  <text x="105" y="81" text-anchor="middle" class="s">in plain words</text>

  <rect x="226" y="44" width="170" height="50" rx="6" class="box"/>
  <text x="311" y="64" text-anchor="middle" class="t b">2 · Read the assessment</text>
  <text x="311" y="81" text-anchor="middle" class="s">verdict · findings with articles · flags</text>

  <rect x="436" y="44" width="200" height="50" rx="6" class="box"/>
  <text x="536" y="64" text-anchor="middle" class="t b">2b · Revise if changes are requested</text>
  <text x="536" y="81" text-anchor="middle" class="s">answer each request · revise · run again → v2</text>

  <rect x="700" y="44" width="170" height="50" rx="6" class="box"/>
  <text x="785" y="64" text-anchor="middle" class="t b">6 · Next assessment</text>
  <text x="785" y="81" text-anchor="middle" class="s">applies lessons and preferences</text>

  <!-- DPO lane -->
  <rect x="226" y="140" width="170" height="44" rx="6" class="box"/>
  <text x="311" y="158" text-anchor="middle" class="t b">3 · Request arrives</text>
  <text x="311" y="174" text-anchor="middle" class="s">automatically, no button</text>

  <rect x="440" y="140" width="232" height="44" rx="6" class="box"/>
  <text x="556" y="158" text-anchor="middle" class="t b">4 · Approve · request changes · reject</text>
  <text x="556" y="174" text-anchor="middle" class="s">amend first if needed · reject needs a reason</text>

  <!-- store lane -->
  <rect x="436" y="232" width="200" height="44" rx="6" class="box"/>
  <text x="536" y="250" text-anchor="middle" class="t b">5a · Register entry</text>
  <text x="536" y="266" text-anchor="middle" class="s">approval only · PDF export for audits</text>

  <rect x="656" y="232" width="226" height="44" rx="6" class="box"/>
  <text x="769" y="250" text-anchor="middle" class="t b">5b · Memory</text>
  <text x="769" y="266" text-anchor="middle" class="s">DPO lessons · PM preference note</text>

  <!-- edges -->
  <line x1="180" y1="69" x2="226" y2="69" class="edge" marker-end="url(#a)"/>
  <line x1="311" y1="94" x2="311" y2="140" class="edge blue" marker-end="url(#ab)"/>
  <text x="304" y="121" class="el" text-anchor="end">sent to the DPO</text>
  <line x1="396" y1="158" x2="440" y2="158" class="edge" marker-end="url(#a)"/>
  <line x1="520" y1="184" x2="520" y2="232" class="edge blue" marker-end="url(#ab)"/>
  <text x="440" y="212" class="el" text-anchor="end">approve</text>
  <polyline points="600,184 600,214 700,214 700,232" class="edge blue" marker-end="url(#ab)"/>
  <text x="650" y="209" class="el" text-anchor="middle">approve or reject</text>
  <polyline points="672,162 785,162 785,94" class="edge dash" marker-end="url(#a)"/>
  <text x="676" y="157" class="s">decision shown</text>
  <line x1="500" y1="140" x2="500" y2="94" class="edge" style="stroke:#b45309" marker-end="url(#a)"/>
  <text x="506" y="121" class="el" style="fill:#b45309">request changes</text>
  <polyline points="436,86 418,86 418,176 396,176" class="edge blue" marker-end="url(#ab)"/>
  <text x="412" y="131" class="el" transform="rotate(-90 412 131)" text-anchor="middle">v2 to the DPO</text>
  <polyline points="850,232 850,94" class="edge blue dash" marker-end="url(#ab)"/>
  <text x="842" y="160" class="el" transform="rotate(-90 842 160)" text-anchor="middle">read next time</text>
</svg>
