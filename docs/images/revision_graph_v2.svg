<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Helvetica, Arial, sans-serif" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#ffffff;stroke:#374151;stroke-width:1.4}
    .agent{fill:#eef2ff}.gate{fill:#fff7e6}.hum{fill:#fff7e6;stroke:#b45309;stroke-dasharray:5 3}.new{stroke:#1d4ed8;stroke-width:2}
    .t{fill:#1f2937}.b{font-weight:700}.s{fill:#6b7280;font-size:10.5px}
    .e{fill:none;stroke:#374151;stroke-width:1.5;marker-end:url(#a)}
    .j{fill:none;stroke:#374151;stroke-width:1.5}
    .ed{fill:none;stroke:#374151;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#a)}
    .en{fill:none;stroke:#1d4ed8;stroke-width:2;marker-end:url(#ab)}
    .el{fill:#374151;font-size:10.5px}.eln{fill:#1d4ed8;font-size:10.5px;font-weight:700}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1000" height="610" fill="#f4f5f8"/>
  <text x="20" y="26" class="t b" font-size="15">Graph v2: one run per feature, two human pauses (blue = new or changed)</text>

  <!-- START / validate / route -->
  <circle cx="110" cy="70" r="9" fill="#374151"/>
  <text x="128" y="74" class="s">START</text>
  <rect x="50" y="100" width="120" height="40" rx="6" class="box"/>
  <text x="110" y="124" text-anchor="middle" class="t b">validate_input</text>
  <path d="M110,79 L110,100" class="e"/>
  <rect x="50" y="170" width="120" height="44" rx="6" class="box"/>
  <text x="110" y="188" text-anchor="middle" class="t b">route</text>
  <text x="110" y="204" text-anchor="middle" class="s">quick / full / reject</text>
  <path d="M110,140 L110,170" class="e"/>

  <!-- reject / direct_answer -->
  <rect x="20" y="250" width="80" height="36" rx="6" class="box"/>
  <text x="60" y="272" text-anchor="middle" class="t b">reject</text>
  <path d="M85,214 L60,250" class="e"/>
  <rect x="120" y="250" width="110" height="36" rx="6" class="box"/>
  <text x="175" y="272" text-anchor="middle" class="t b">direct_answer</text>
  <path d="M130,214 L165,250" class="e"/>

  <!-- worker -->
  <rect x="300" y="160" width="150" height="70" rx="6" class="box agent"/>
  <text x="375" y="183" text-anchor="middle" class="t b">worker</text>
  <text x="375" y="199" text-anchor="middle" class="s">agentic RAG, v1 from scratch</text>
  <text x="375" y="214" text-anchor="middle" class="s">sees only messages</text>
  <path d="M170,190 L300,190" class="e"/>
  <text x="212" y="184" class="el">full</text>

  <!-- tool gate -->
  <rect x="500" y="300" width="130" height="90" rx="6" class="box gate"/>
  <text x="565" y="322" text-anchor="middle" class="t b">tool gate</text>
  <text x="565" y="338" text-anchor="middle" class="s">permission · doom loop</text>
  <rect x="512" y="347" width="106" height="34" rx="5" class="box hum"/>
  <text x="565" y="361" text-anchor="middle" class="s b">interrupt()</text>
  <text x="565" y="374" text-anchor="middle" class="s">waits for the DPO</text>
  <path d="M440,230 L520,300" class="ed"/>
  <text x="458" y="252" class="el">tool calls</text>
  <path d="M440,440 L520,390" class="ed"/>

  <!-- reviser -->
  <rect x="300" y="430" width="150" height="70" rx="6" class="box agent new"/>
  <text x="375" y="453" text-anchor="middle" class="t b">reviser</text>
  <text x="375" y="469" text-anchor="middle" class="s">v2 from v1 + the changes</text>
  <text x="375" y="484" text-anchor="middle" class="s">same tools, same gate</text>

  <!-- output_guardrail -->
  <rect x="660" y="160" width="180" height="70" rx="6" class="box"/>
  <text x="750" y="183" text-anchor="middle" class="t b">output_guardrail</text>
  <text x="750" y="199" text-anchor="middle" class="s">citations · PII · schema · rules</text>
  <text x="750" y="214" text-anchor="middle" class="s">stores the draft, asks for review</text>
  <path d="M450,180 L660,180" class="e"/>
  <path d="M660,200 L450,200" class="ed"/>
  <text x="490" y="196" class="el">regenerate / request review</text>
  <path d="M230,268 L770,268 L770,230" class="e"/>
  <path d="M450,465 L700,465 L700,230" class="e"/>
  <path d="M660,222 L640,222 L640,445 L450,445" class="ed"/>
  <text x="470" y="441" class="el">regenerate / request review</text>

  <!-- memory_write -->
  <rect x="880" y="160" width="100" height="70" rx="6" class="box"/>
  <text x="930" y="190" text-anchor="middle" class="t b">memory_</text>
  <text x="930" y="205" text-anchor="middle" class="t b">write</text>
  <path d="M840,195 L880,195" class="e"/>
  <text x="846" y="246" class="el">after a DPO decision</text>

  <!-- END -->
  <circle cx="930" cy="80" r="9" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="930" cy="80" r="4" fill="#374151"/>
  <path d="M930,160 L930,89" class="e"/>
  <text x="922" y="128" text-anchor="end" class="el">approved /</text>
  <text x="922" y="140" text-anchor="end" class="el">rejected</text>
  <path d="M750,160 L750,120 L930,120" class="j"/>
  <text x="760" y="114" class="el">quick answer</text>
  <path d="M60,286 L60,580 L985,580 L985,80 L939,80" class="e"/>

  <!-- pm_revision -->
  <rect x="740" y="400" width="220" height="90" rx="6" class="box new"/>
  <text x="850" y="422" text-anchor="middle" class="t b">pm_revision</text>
  <rect x="752" y="432" width="196" height="50" rx="5" class="box hum"/>
  <text x="850" y="448" text-anchor="middle" class="s b">interrupt() · waits for the PM</text>
  <text x="850" y="462" text-anchor="middle" class="s">revised text + done / not possible</text>
  <text x="850" y="475" text-anchor="middle" class="s">deterministic screen, re-asks if it fails</text>
  <path d="M930,230 L930,400" class="en"/>
  <text x="922" y="310" text-anchor="end" class="eln">changes</text>
  <text x="922" y="323" text-anchor="end" class="eln">requested</text>
  <path d="M740,480 L450,480" class="en"/>
  <text x="520" y="497" class="eln">revision brief → reviser</text>
</svg>
