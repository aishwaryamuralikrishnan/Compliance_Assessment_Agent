<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{fill:#1f2937}
    .b{font-weight:700}
    .s{fill:#4b5563;font-size:11.5px}
    .lbl{fill:#6b7280;font-size:10px;letter-spacing:.06em}
    .cell{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
    .head{fill:#e5e7eb;stroke:#d1d5db;stroke-width:1}
  </style>
  <rect x="0" y="0" width="900" height="250" fill="#f4f5f8"/>

  <!-- header row -->
  <rect x="14" y="14" width="150" height="30" class="head"/>
  <text x="89" y="33" text-anchor="middle" class="lbl">TYPE OF USER</text>
  <rect x="164" y="14" width="196" height="30" class="head"/>
  <text x="262" y="33" text-anchor="middle" class="lbl">USER</text>
  <rect x="360" y="14" width="526" height="30" class="head"/>
  <text x="623" y="33" text-anchor="middle" class="lbl">TASKS</text>

  <!-- row 1: product manager -->
  <rect x="14" y="44" width="150" height="96" class="cell"/>
  <text x="89" y="86" text-anchor="middle" class="t b">Primary</text>
  <text x="89" y="104" text-anchor="middle" class="s">asks</text>

  <rect x="164" y="44" width="196" height="96" class="cell"/>
  <circle cx="200" cy="80" r="11" fill="#1f5f8b"/>
  <path d="M182 112 a18 18 0 0 1 36 0" fill="#1f5f8b"/>
  <text x="226" y="84" class="t b">Product manager</text>
  <text x="226" y="101" class="s">lena.k · describes features</text>
  <text x="226" y="116" class="s">in plain words</text>

  <rect x="360" y="44" width="526" height="96" class="cell"/>
  <text x="376" y="66" class="s">• Describes a planned feature; gets a verdict and severity-tagged findings, each citing its article</text>
  <text x="376" y="86" class="s">• Asks a quick legal question ("must we delete a customer's data on request?"): a cited answer</text>
  <text x="376" y="106" class="s">• Sees the DPO's decision on the same page; leaves a preference note for future assessments</text>
  <text x="376" y="126" class="s">• Reads the register and the memory</text>

  <!-- row 2: DPO -->
  <rect x="14" y="140" width="150" height="96" class="cell"/>
  <text x="89" y="182" text-anchor="middle" class="t b">Secondary</text>
  <text x="89" y="200" text-anchor="middle" class="s">decides</text>

  <rect x="164" y="140" width="196" height="96" class="cell"/>
  <circle cx="200" cy="176" r="11" fill="#8a6d3b"/>
  <path d="M182 208 a18 18 0 0 1 36 0" fill="#8a6d3b"/>
  <text x="226" y="180" class="t b">Data Protection Officer</text>
  <text x="226" y="197" class="s">m.weber · reviews, never</text>
  <text x="226" y="212" class="s">generates assessments</text>

  <rect x="360" y="140" width="526" height="96" class="cell"/>
  <text x="376" y="162" class="s">• Takes a request from the queue; amends, approves (writes the register) or rejects with a reason</text>
  <text x="376" y="182" class="s">• Teaches the assistant: amendments, comments and rejection reasons become standing positions;</text>
  <text x="376" y="197" class="s">   an approved assessment can be kept as a good example</text>
  <text x="376" y="217" class="s">• Exports the processing register as a PDF for audits</text>
</svg>
