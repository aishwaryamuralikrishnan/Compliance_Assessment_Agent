<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#ffffff;stroke:#374151;stroke-width:1.4}
    .pm{fill:#e8f0f7}.dpo{fill:#f3ecdf}.rec{fill:#eaf2e9}.bad{fill:#fde8e8}
    .t{fill:#1f2937}.b{font-weight:700}.s{fill:#6b7280;font-size:11px}
    .e{fill:none;stroke:#374151;stroke-width:1.6}
    .g{stroke:#15803d}.o{stroke:#b45309}.r{stroke:#b91c1c}
    .lg{fill:#15803d;font-weight:700}.lo{fill:#b45309;font-weight:700}.lr{fill:#b91c1c;font-weight:700}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#15803d"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="900" height="430" fill="#f4f5f8"/>

  <!-- row 1 -->
  <rect x="30" y="40" width="190" height="60" rx="8" class="box pm"/>
  <text x="125" y="65" text-anchor="middle" class="t b">PM describes the feature</text>
  <text x="125" y="84" text-anchor="middle" class="s">"…using browsing behaviour…"</text>

  <rect x="290" y="40" width="190" height="60" rx="8" class="box pm"/>
  <text x="385" y="65" text-anchor="middle" class="t b">Assessment v1</text>
  <text x="385" y="84" text-anchor="middle" class="s">goes to the DPO automatically</text>

  <rect x="550" y="30" width="230" height="80" rx="8" class="box dpo"/>
  <text x="665" y="55" text-anchor="middle" class="t b">DPO decides</text>
  <text x="665" y="74" text-anchor="middle" class="s">may first correct wording or severity</text>
  <text x="665" y="90" text-anchor="middle" class="s">(that is "amend": fixing the assessment)</text>

  <line x1="220" y1="70" x2="290" y2="70" class="e" marker-end="url(#a)"/>
  <line x1="480" y1="70" x2="550" y2="70" class="e" marker-end="url(#a)"/>

  <!-- approve -->
  <polyline points="780,55 820,55 820,200 780,200" class="e g" marker-end="url(#ag)"/>
  <text x="812" y="135" class="lg" transform="rotate(-90 812 135)" text-anchor="middle">Approve</text>
  <rect x="550" y="170" width="230" height="60" rx="8" class="box rec"/>
  <text x="665" y="195" text-anchor="middle" class="t b">Register entry</text>
  <text x="665" y="214" text-anchor="middle" class="s">only here; a feature that needs no change</text>

  <!-- request changes -->
  <polyline points="550,95 495,95 495,290 125,290 125,100" class="e o" marker-end="url(#ao)"/>
  <text x="300" y="282" text-anchor="middle" class="lo">Request changes: "drop the browsing data"</text>
  <rect x="30" y="310" width="190" height="60" rx="8" class="box pm"/>
  <text x="125" y="335" text-anchor="middle" class="t b">PM revises the feature</text>
  <text x="125" y="354" text-anchor="middle" class="s">same conversation, text box reopens</text>
  <polyline points="125,290 125,310" class="e o"/>
  <rect x="290" y="310" width="190" height="60" rx="8" class="box pm"/>
  <text x="385" y="335" text-anchor="middle" class="t b">Assessment v2</text>
  <text x="385" y="354" text-anchor="middle" class="s">linked to v1 · back to the DPO</text>
  <line x1="220" y1="340" x2="290" y2="340" class="e" marker-end="url(#a)"/>
  <polyline points="480,340 515,340 515,70" class="e" marker-end="url(#a)"/>

  <!-- reject -->
  <rect x="550" y="250" width="230" height="56" rx="8" class="box bad"/>
  <text x="665" y="273" text-anchor="middle" class="t b">Rejected</text>
  <text x="665" y="292" text-anchor="middle" class="s">feature should not be built; nothing recorded</text>
  <polyline points="780,85 860,85 860,278 780,278" class="e r" marker-end="url(#ar)"/>
  <text x="852" y="185" class="lr" transform="rotate(-90 852 185)" text-anchor="middle">Reject</text>

  <!-- memory note -->
  <rect x="30" y="390" width="750" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="405" y="409" text-anchor="middle" class="s">All three decisions teach the assistant: the DPO's corrections, requested changes and rejection reasons become lessons; the register is written only by Approve.</text>
</svg>
